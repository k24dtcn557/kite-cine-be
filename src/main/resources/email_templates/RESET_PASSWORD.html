<!doctype html>
<html lang="en" aria-label="message body">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>THÔNG BÁO MẬT KHẨU MỚI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom Font Variables */
      :root {
        --primary-font: Arial, Helvetica, sans-serif;
        --heading-font: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --fallback-font: Arial, Helvetica, sans-serif;
      }

      /* Reset */
      body,
      table,
      td,
      a {
        text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      table,
      td {
        border-collapse: collapse !important;
      }

      img {
        border: 0;
        line-height: 100%;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        background-color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Responsive */
      @media only screen and (max-width: 600px) {
        .email-container {
          width: 100% !important;
        }

        .hero-image img {
          width: 100% !important;
          height: auto !important;
        }

        .title {
          font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
          font-size: 22px !important;
          color: #ffffff !important;
        }

        .text {
          font-family:
            "Source Sans Pro",
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            Helvetica,
            sans-serif;
          font-size: 14px !important;
          color: #ffffff !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      overflow-wrap: break-word;
      line-break: after-white-space;
      background-color: #ffffff;
    "
  >
    <table
      role="presentation"
      width="100%"
      bg-color="#ffffff"
      style="
        width: 100%;
        margin: 0 auto;
        table-layout: fixed;
        border-collapse: collapse;
      "
    >
      <tr>
        <td style="text-align: center; padding: 20px 0">
          <table
            role="presentation"
            class="email-container"
            width="500"
            style="
              display: inline-block;
              max-width: 500px;
              width: 500px;
              margin: 0 auto;
              color: #ffffff;
              background-color: #dc5829;
              border-radius: 10px;
              overflow: hidden;
              border-collapse: collapse;
              text-align: left;
            "
          >
            <tr>
              <td style="padding: 40px 0px 10px; text-align: center">
                <img
                        src="https://kitecine.hph.id.vn/kite-image.png"
                        width="120"
                        height="80"
                        alt="KITE CINE"
                        style="display: block; margin: 0 auto"
                />
              </td>
            </tr>

            <tr>
              <td
                class="content-padding"
                style="
                  padding: 20px 30px 40px;
                  color: #fbe9e7;
                  line-height: normal;
                "
              >
                <div
                  style="
                    border-top: 1px solid #e27d54;
                    border-bottom: 1px solid #e27d54;
                    padding: 20px 0;
                  "
                >
                  <div
                    style="
                      font-family:
                        &quot;Cormorant Garamond&quot;, Georgia,
                        &quot;Times New Roman&quot;, serif;
                      text-align: justify;
                      font-size: 20px !important;
                      color: #fbe9e7 !important;
                      font-weight: bold;
                    "
                  >
                    Xin chào, <br /><br />
                  </div>

                  <div
                    style="
                      font-family:
                        &quot;Source Sans Pro&quot;,
                        -apple-system,
                        BlinkMacSystemFont,
                        &quot;Segoe UI&quot;,
                        Arial,
                        Helvetica,
                        sans-serif;
                      text-align: justify;
                      font-size: 15px;
                      font-weight: 400;
                      color: #fbe9e7;
                      line-height: 1.6;
                    "
                  >
                    Mật khẩu mới của bạn: <br />
                    <strong
                      style="
                        color: #ffffff;
                        font-size: 16px;
                        display: block;
                        margin: 8px 0;
                        padding-left: 10px;
                        text-align: center;
                      "
                      >${NEW_PASSWORD}
                    </strong>
                    Vui lòng đăng nhập và đổi mật khẩu ngay để bảo mật tài khoản của bạn.
                  </div>
                </div>

                <div
                  style="
                    font-family: &quot;Source Sans Pro&quot;, Arial, sans-serif;
                    font-size: 13px;
                    color: #fbe9e7;
                    margin-top: 25px;
                    text-align: left;
                    line-height: 1.4;
                  "
                >
                  Trân trọng,<br />
                  <strong>KITE CINE</strong>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
